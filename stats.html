<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self'; script-src 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TickNote 统计</title>
    <link rel="stylesheet" href="stats.css" />
  </head>
  <body>
    <header class="titlebar">
      <div class="titlebar-left">
        <h1>时间统计</h1>
        <div class="summary-inline">
          <span><b id="totalMinutes">0分</b></span>
          <span><b id="totalSessions">0</b> 条</span>
        </div>
      </div>
      <div class="titlebar-actions">
        <button id="miniBtn" class="tool-btn" type="button" title="迷你模式：最近5条">迷</button>
        <button id="searchBtn" class="tool-btn" type="button" title="搜索历史">搜</button>
        <button id="deviceBtn" class="tool-btn" type="button" title="显示机器名">机</button>
        <button id="lockBtn" class="tool-btn" type="button" title="固定位置">固</button>
        <button id="topBtn" class="tool-btn" type="button" title="窗口置顶">顶</button>
        <button id="opacityBtn" class="tool-btn" type="button" title="透明度">透</button>
        <button id="closeBtn" class="close-btn" type="button" title="关闭">×</button>
      </div>
    </header>

    <section id="searchLine" class="search-line hidden">
      <input
        id="searchInput"
        class="search-input"
        type="search"
        placeholder="多关键词=同时包含，-词=排除…"
        spellcheck="false"
        autocomplete="off"
      />
      <button id="searchClearBtn" class="nav-btn" type="button" title="关闭搜索">×</button>
    </section>

    <section id="navLine" class="nav-line">
      <div class="date-cluster">
        <button id="homeBtn" class="nav-btn home-btn" type="button" title="回到当前时间">⌂</button>
        <button id="prevDayBtn" class="nav-btn" type="button" title="前一天有数据">‹</button>
        <div class="date-wrap">
          <button id="dateLabel" class="date-text" type="button" title="选择有数据的日期">
            2026-11-10
          </button>
          <div id="calendarPop" class="calendar-pop hidden" role="dialog" aria-label="选择日期">
            <div class="cal-head">
              <button id="calPrevMonth" class="nav-btn" type="button">‹</button>
              <div id="calMonthLabel" class="cal-month">2026年11月</div>
              <button id="calNextMonth" class="nav-btn" type="button">›</button>
            </div>
            <div class="cal-weekdays">
              <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
            </div>
            <div id="calDays" class="cal-days"></div>
          </div>
        </div>
        <button id="nextDayBtn" class="nav-btn" type="button" title="后一天有数据">›</button>
      </div>
      <div id="hourList" class="hour-list"></div>
    </section>

    <section id="recordList" class="record-list"></section>
    <div id="empty" class="empty hidden">这一天还没有记录。</div>
    <div id="hourEmpty" class="empty hidden">请选择有数据的小时。</div>
    <div id="miniEmpty" class="empty hidden">还没有记录。</div>

    <script src="stats.js"></script>
  </body>
</html>
