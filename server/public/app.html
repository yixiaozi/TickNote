<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>控制台 · TickNote Timeline</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#3dd6c6" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="site-header-inner">
        <a class="brand" href="/">
          <img class="brand-mark" src="/icon.png" alt="" width="28" height="28" />
          <span>TickNote Timeline</span>
        </a>
        <nav class="nav-links">
          <a href="/app">控制台</a>
          <a href="/settings">设置</a>
          <a id="publicLink" href="#" class="hidden">我的公开页</a>
          <button id="logoutBtn" type="button" class="ghost">退出</button>
        </nav>
      </div>
    </header>

    <main class="page">
      <header class="topbar">
        <div>
          <h1>控制台</h1>
          <p id="welcome" class="sub"></p>
        </div>
        <div class="topbar-actions">
          <button id="refreshBtn" type="button" class="ghost">刷新</button>
          <a class="btn soft" href="/settings">账号设置</a>
        </div>
      </header>

      <section class="cards" id="summaryCards"></section>

      <section class="panel">
        <h2>按天（最近）</h2>
        <div id="dayChart" class="bar-list"></div>
      </section>

      <section class="panel">
        <h2>一天中的分布（小时）</h2>
        <div id="hourChart" class="bar-list hour-grid"></div>
      </section>

      <section class="panel">
        <h2>设备</h2>
        <div id="deviceChart" class="bar-list"></div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h2>最近记录</h2>
          <span id="sessionCount" class="muted"></span>
        </div>
        <div id="sessionList" class="session-list"></div>
      </section>
    </main>

    <script src="/common.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
