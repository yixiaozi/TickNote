<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>设置 · TickNote Timeline</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#3dd6c6" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="site-header-inner">
        <a class="brand" href="/">
          <img class="brand-mark" src="/icon.png" alt="" width="28" height="28" />
          <span>TickNote Timeline</span>
        </a>
        <nav class="nav-links">
          <a href="/app">控制台</a>
          <a href="/settings">设置</a>
          <button id="logoutBtn" type="button" class="ghost">退出</button>
        </nav>
      </div>
    </header>

    <main class="page">
      <header class="topbar">
        <div>
          <h1>账号设置</h1>
          <p class="sub">管理展示信息，以及是否公开你的时间线主页。</p>
        </div>
      </header>

      <form id="settingsForm" class="settings-card">
        <h2>基本资料</h2>
        <label>
          用户名
          <input id="username" disabled />
        </label>
        <label>
          显示名称
          <input id="displayName" maxlength="40" placeholder="例如：小王" />
        </label>
        <label>
          简介
          <textarea
            id="bio"
            maxlength="280"
            placeholder="一句话介绍你在记什么时间"
          ></textarea>
        </label>

        <h2 style="margin-top: 8px">公开主页</h2>
        <div class="toggle-row">
          <div>
            <strong>公开我的主页</strong>
            <span class="hint"
              >开启后，任何人可通过下方链接查看统计与近期记录。</span
            >
          </div>
          <label class="switch" title="是否公开">
            <input id="isPublic" type="checkbox" />
            <span></span>
          </label>
        </div>
        <label>
          公开页标题
          <input
            id="publicTitle"
            maxlength="80"
            placeholder="例如：小王的工作时间线"
          />
        </label>
        <p class="hint">
          公开地址：
          <a id="publicUrl" href="#" target="_blank" rel="noopener"></a>
        </p>

        <p id="saveError" class="error hidden"></p>
        <p id="saveOk" class="ok hidden">已保存</p>
        <div class="form-actions">
          <button type="submit" class="primary">保存设置</button>
          <a class="btn ghost" href="/app">返回控制台</a>
        </div>
      </form>
    </main>

    <script src="/common.js"></script>
    <script src="/settings.js"></script>
  </body>
</html>
