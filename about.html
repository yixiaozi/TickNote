<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self'; script-src 'self'"
    />
    <title data-i18n="about.title">About TickNote</title>
    <link rel="stylesheet" href="about.css" />
  </head>
  <body>
    <div class="shell">
      <button
        id="closeBtn"
        class="close"
        type="button"
        title="Close"
        data-i18n-title="common.close"
      >
        ×
      </button>
      <div class="hero">
        <div class="mark">TN</div>
        <div>
          <h1>TickNote</h1>
          <p class="tag" data-i18n="about.tag">Tick notes · one-minute time blocks</p>
        </div>
      </div>
      <p class="desc" data-i18n="about.desc">
        A light countdown that slices time into reviewable blocks. Note what you
        did, sync across PCs, and dig into stats on Timeline.
      </p>
      <div class="meta">
        <div>
          <span data-i18n="about.version">Version</span><b id="version">—</b>
        </div>
        <div>
          <span data-i18n="about.sync_site">Sync site</span
          ><b>timeline.wangyang.wiki</b>
        </div>
      </div>
      <div class="actions">
        <button id="githubBtn" type="button">GitHub</button>
        <button id="siteBtn" type="button" class="ghost" data-i18n="about.site">
          Website
        </button>
        <button id="timelineBtn" type="button" class="ghost">Timeline</button>
      </div>
    </div>
    <script src="i18n.js"></script>
    <script src="about.js"></script>
  </body>
</html>
