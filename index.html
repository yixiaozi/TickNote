<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self'; script-src 'self'; media-src 'self' blob:"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TickNote</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="widget" class="widget" aria-live="polite">
      <div class="top-actions">
        <button
          id="tickBtn"
          class="icon-btn tick-btn on"
          type="button"
          title="滴答声：开"
          aria-label="切换滴答声"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M12 2C12 2 6 9.2 6 13.2a6 6 0 0 0 12 0C18 9.2 12 2 12 2z"
            />
          </svg>
        </button>
        <button
          id="statsBtn"
          class="icon-btn chart-btn"
          type="button"
          title="查看统计"
          aria-label="查看统计"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="4" y="11" width="3.2" height="9" rx="1" />
            <rect x="10.4" y="6" width="3.2" height="14" rx="1" />
            <rect x="16.8" y="3" width="3.2" height="17" rx="1" />
          </svg>
        </button>
      </div>

      <div class="main-row">
        <div class="ring" aria-hidden="true">
          <svg viewBox="0 0 100 100">
            <circle class="ring-track" cx="50" cy="50" r="42" />
            <circle id="ringProgress" class="ring-progress" cx="50" cy="50" r="42" />
          </svg>
        </div>
        <div class="time-block" title="拖动移动位置">
          <div class="time-row">
            <div id="time" class="time">1:00</div>
            <span
              id="resetBtn"
              class="loop-label"
              role="button"
              tabindex="0"
              title="重置并记入统计"
              ><span class="loop-affix">第</span><span id="loopCount">0</span
              ><span class="loop-affix">轮</span></span
            >
          </div>
        </div>
      </div>

      <div class="bottom-row">
        <textarea
          id="noteInput"
          class="note-input"
          rows="1"
          maxlength="2000"
          placeholder="正在做什么…（时间标记）"
          spellcheck="false"
          title="回车结束本轮；Ctrl+Enter 换行"
        ></textarea>
      </div>
      <div id="flash" class="flash" aria-hidden="true"></div>
    </div>
    <script src="renderer.js"></script>
  </body>
</html>
