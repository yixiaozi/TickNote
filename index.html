<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self'; script-src 'self'; media-src 'self' blob:"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TickNote</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="widget" class="widget" aria-live="polite">
      <div class="top-actions">
        <button
          id="tickBtn"
          class="icon-btn tick-btn on"
          type="button"
          title="Tick sound: on"
          aria-label="Toggle tick sound"
          data-i18n-title="main.tick_on"
          data-i18n-aria="main.tick_toggle"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M12 2C12 2 6 9.2 6 13.2a6 6 0 0 0 12 0C18 9.2 12 2 12 2z"
            />
          </svg>
        </button>
        <button
          id="statsBtn"
          class="icon-btn chart-btn"
          type="button"
          title="Open stats"
          aria-label="Open stats"
          data-i18n-title="main.stats"
          data-i18n-aria="main.stats"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="4" y="11" width="3.2" height="9" rx="1" />
            <rect x="10.4" y="6" width="3.2" height="14" rx="1" />
            <rect x="16.8" y="3" width="3.2" height="17" rx="1" />
          </svg>
        </button>
      </div>

      <div class="main-row">
        <div class="ring" aria-hidden="true">
          <svg viewBox="0 0 100 100">
            <circle class="ring-track" cx="50" cy="50" r="42" />
            <circle id="ringProgress" class="ring-progress" cx="50" cy="50" r="42" />
          </svg>
        </div>
        <div class="time-block" title="Drag to move" data-i18n-title="main.drag">
          <div class="time-row">
            <div id="time" class="time">1:00</div>
            <span
              id="resetBtn"
              class="loop-label"
              role="button"
              tabindex="0"
              title="Reset and save to stats"
              data-i18n-title="main.reset"
              ><span class="loop-affix" data-i18n="main.loop_prefix">R</span
              ><span id="loopCount">0</span
              ><span class="loop-affix" data-i18n="main.loop_suffix"></span
            ></span>
          </div>
        </div>
      </div>

      <div class="bottom-row">
        <textarea
          id="noteInput"
          class="note-input"
          rows="1"
          maxlength="2000"
          placeholder="What are you doing… (time note)"
          spellcheck="false"
          oncontextmenu="return false"
          title="Enter ends this round; Ctrl+Enter for newline"
          data-i18n-placeholder="main.note_placeholder"
          data-i18n-title="main.note_title"
        ></textarea>
      </div>
      <div id="flash" class="flash" aria-hidden="true"></div>
    </div>
    <script src="i18n.js"></script>
    <script src="renderer.js"></script>
  </body>
</html>
